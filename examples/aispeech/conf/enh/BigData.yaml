# speech enhancement
name: aispeech
version: -5a

system:
  name: DualSE
  exp_name: ${system.name}
  debug: false
  seed: 0
  log_dir: exp/logs

model:
  name: DNet
  param: DNet_6_64
  init: /public/home/wenbin_jiang/workspace/AlphaSpeech/examples/aispeech/exp/logs/DualSE_DNet/5a0/checkpoints/last.ckpt
  mask: true
  debug: ${system.debug}

data:
  name: WavDataset # default dataset class
  pairs: noisy2clean # [noisy2clean, noisy2noisy, noisier2noisy]
  data_dir: data
  sample_rate: 16000
  chunk_size: 249
  units: units/units_phn121.txt
  filter: 0.95 # Keep the data of the middle 95% quantile duration, or with lower_bound and upper_bound
  feats:
    skip_frame: 4
    splice: [2,2]
    transform: transform/final.200.feature_transform.vad.torch
  train:
    name: ${data.name}
    noisy_store:
      - Bigdata/tr/split8_1kw/0/noise0.flac.hdf5
      - Bigdata/tr/split8_1kw/1/noise1.flac.hdf5
      - Bigdata/tr/split8_1kw/2/noise2.flac.hdf5
      - Bigdata/tr/split8_1kw/3/noise3.flac.hdf5
      - Bigdata/tr/split8_1kw/4/noise4.flac.hdf5
      - Bigdata/tr/split8_1kw/5/noise5.flac.hdf5
      - Bigdata/tr/split8_1kw/6/noise6.flac.hdf5
      - Bigdata/tr/split8_1kw/7/noise7.flac.hdf5
    noisy_csv:
      - Bigdata/tr/split8_1kw/0/noise0.csv
      - Bigdata/tr/split8_1kw/1/noise1.csv
      - Bigdata/tr/split8_1kw/2/noise2.csv
      - Bigdata/tr/split8_1kw/3/noise3.csv
      - Bigdata/tr/split8_1kw/4/noise4.csv
      - Bigdata/tr/split8_1kw/5/noise5.csv
      - Bigdata/tr/split8_1kw/6/noise6.csv
      - Bigdata/tr/split8_1kw/7/noise7.csv
    clean_store:
      - Bigdata/tr/split8_1kw/0/clean0.flac.hdf5
      - Bigdata/tr/split8_1kw/1/clean1.flac.hdf5
      - Bigdata/tr/split8_1kw/2/clean2.flac.hdf5
      - Bigdata/tr/split8_1kw/3/clean3.flac.hdf5
      - Bigdata/tr/split8_1kw/4/clean4.flac.hdf5
      - Bigdata/tr/split8_1kw/5/clean5.flac.hdf5
      - Bigdata/tr/split8_1kw/6/clean6.flac.hdf5
      - Bigdata/tr/split8_1kw/7/clean7.flac.hdf5
    clean_csv:
      - Bigdata/tr/split8_1kw/0/clean0.csv
      - Bigdata/tr/split8_1kw/1/clean1.csv
      - Bigdata/tr/split8_1kw/2/clean2.csv
      - Bigdata/tr/split8_1kw/3/clean3.csv
      - Bigdata/tr/split8_1kw/4/clean4.csv
      - Bigdata/tr/split8_1kw/5/clean5.csv
      - Bigdata/tr/split8_1kw/6/clean6.csv
      - Bigdata/tr/split8_1kw/7/clean7.csv      
    split_wav: true
    filter: ${data.filter}
  valid:
    name: ${data.name}
    noisy_store: valid/aispeech_noisy.flac.hdf5
    noisy_csv: valid/aispeech.csv
    clean_store: valid/aispeech_clean.flac.hdf5
    clean_csv: valid/aispeech.csv
    split_wav: false
  test:
    name: ${data.name}
    noisy_store: test/cn_fan_Midea-XiDun.flac.hdf5
    noisy_csv: test/cn_fan_Midea-XiDun.csv
    clean_store: null
    clean_csv: null
    split_wav: false
  # noise_store: noise/aispeech.flac.hdf5
  # noise_csv: noise/aispeech.csv # "wav_id,wav_path,duration"
  # rir_store: rir/rir.wav.hdf5
  # rir_csv: rir/rir.csv # "wav_id,wav_path,duration"
  # add_rir: 0
  mix_param:
    sr: ${data.sample_rate}
    snr_lower: -10
    snr_upper: 10
    randomize_snr: true
    target_level_lower: -35
    target_level_upper: -15
    fs: ${data.sample_rate}
    audio_length: 30
    silence_length: 0.2
    clean_activity_threshold: 0.6
    noise_activity_threshold: 0.0
    is_test_set: false
    lower_t60: 0.3
    upper_t60: 1.3
  dataloader:
    batch_size: 17
    shuffle: true
    num_workers: 8
    pin_memory: true
    prefetch_factor: 16
    persistent_workers: true
    collate_fn: AudioCollateFn
  valid_batch_size: 1
  data_augment: # null
    remix: false
    bandmask:
      maxwidth: 0.2
    shift: false
    revecho: false

loss:
  name: HybridLoss

# pytorch-lightning trainer
trainer:
  max_epochs: 100
  gradient_clip_val: 5.0
  log_every_n_steps: 100
  strategy: ddp_find_unused_parameters_true # ddp or ddp_find_unused_parameters_true

trainer_callbacks:
  model_checkpoint:
    monitor: valid_loss
    mode: min
    save_top_k: 3
    save_last: true
  early_stop:
    monitor: ${trainer_callbacks.model_checkpoint.monitor}
    mode: ${trainer_callbacks.model_checkpoint.mode}
    patience: 13
    verbose: true
  progress_bar:
    refresh_rate: 10 # number of batches

optimizer:
  name: AdamW
  lr: 1e-3
  lr_scheduler:
    name: ReduceLROnPlateau
    factor: 0.5
    patience: 3

stft:
  name: torch # torch or filterbank
  n_fft: 512
  win_length: 512
  hop_length: 256

# ===== others =====
pool:
  name: ThreadPoolExecutor
  max_workers: null

deepfilter:
  n_filter_f: 3 # frequency
  n_filter_t: 5 # time
  n_filter_c: 16 # channel
  complex: false
  expand: SPConv
  method: filtering # masking, filtering

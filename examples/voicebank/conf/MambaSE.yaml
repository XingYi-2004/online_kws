name: voicebank
version: -3a

system:
  name: MambaSE
  exp_name: ${system.name}
  debug: false
  seed: 0
  log_dir: exp/logs
  train_and_test: true

model:
  name: MambaNet
  mask: true
  debug: ${system.debug}
  hid_feature: 64  # Channels in dense layers.
  num_tfmamba: 4  # Number of Time-Frequency Mamba (TFMamba) blocks in the model.
  d_state: 16  # Dimensionality of the state vector in Mamba blocks.
  d_conv: 4  # Convolutional layer dimensionality within Mamba blocks.
  expand: 4  # Expansion factor for the layers within the Mamba blocks.
  norm_epsilon: 0.00001  # Numerical stability in normalization layers within the Mamba blocks.

data:
  name: WavDataset # default dataset class
  pairs: noisy2clean # [noisy2clean, noisy2noisy, noisier2noisy]
  data_dir: data
  sample_rate: 16000
  chunk_size: 317 # frames feed to network, 157: 1s, 317: 2s, 637: 4s  
  train:
    name: ${data.name}
    noisy_store: noisy.flac.hdf5
    noisy_csv: train/train.csv  # "wav_id,wav_path,duration"
    clean_store: clean.flac.hdf5
    clean_csv: ${data.train.noisy_csv}
    split_wav: true
  valid:
    name: ${data.name}
    noisy_store: ${data.train.noisy_store}
    noisy_csv: valid/valid.csv
    clean_store: ${data.train.clean_store}
    clean_csv: ${data.valid.noisy_csv}
    split_wav: false
  test:
    name: ${data.name}
    noisy_store: ${data.train.noisy_store}
    noisy_csv: test/test.csv
    clean_store: ${data.train.clean_store}
    clean_csv: ${data.test.noisy_csv}
    split_wav: false
  noise_store: noise/noise.wav.hdf5
  noise_csv: noise/noise.csv # "wav_id,wav_path,duration"
  rir_store: rir/rir.wav.hdf5 
  rir_csv: rir/rir.csv # "wav_id,wav_path,duration"
  add_rir: -1
  mix_param:
    sr: ${data.sample_rate}
    snr_lower: -5
    snr_upper: 20
    randomize_snr: true
    target_level_lower: -35
    target_level_upper: -15
    fs: ${data.sample_rate}
    audio_length: 30
    silence_length: 0.2
    clean_activity_threshold: 0.6
    noise_activity_threshold: 0.0
    is_test_set: false
    lower_t60: 0.3
    upper_t60: 1.3
  dataloader:
    batch_size: 4
    shuffle: true
    num_workers: 8
    pin_memory: false
    prefetch_factor: 4
    collate_fn: AudioCollateFn
  valid_batch_size: 1
  data_augment: # null
    remix: false
    bandmask:
      maxwidth: 0.2
    shift: false
    revecho: false

loss:
  name: FusionLoss
  phase_weight: 0.1

# pytorch-lightning trainer
trainer:
  max_epochs: 50
  gradient_clip_val: 5.0
  log_every_n_steps: 100
  strategy: ddp # ddp or ddp_find_unused_parameters_true
trainer_callbacks:
  model_checkpoint:
    monitor: valid_loss
    mode: min
    save_top_k: 3
    save_last: true
  early_stop:
    monitor: ${trainer_callbacks.model_checkpoint.monitor}
    mode: ${trainer_callbacks.model_checkpoint.mode}
    patience: 5
    verbose: true

optimizer:
  name: AdamW
  lr: 1e-3
  lr_scheduler:
    name: ReduceLROnPlateau
    factor: 0.1
    patience: 3

stft:
  name: torch # torch or filterbank
  n_fft: 400
  win_length: 400
  hop_length: 100

# ===== others =====
pool:
  name: ThreadPoolExecutor
  max_workers: null

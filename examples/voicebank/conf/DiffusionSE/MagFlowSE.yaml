# Flow Matching Speech Enhancement in Spectrum Domain
name: voicebank
version: -3a

system:
  name: SpecFlowSE
  exp_name: ${system.name}
  debug: false
  seed: 0
  log_dir: exp/logs
  train_and_test: true
  valid_metric: true

model:
  name: DiffAdaptNet
  backbone: MatchaDecoder
  ema_decay: 0.999
  complex: false
  valid_wav_every_n_epoch: 120
  ode_param:
    name: Naive
    sigma_min: 0
    sigma_max: 0.5
    T_rev: 1.0
    t_eps: 0.03
    n_timesteps: 5
  param:
    num_heads: 4
    act_fn: snakebeta
  mask: false
  debug: ${system.debug}

data:
  name: WavDataset # default dataset class
  pairs: noisy2clean # [noisy2clean, noisy2noisy, noisier2noisy]
  data_dir: data
  sample_rate: 16000
  chunk_size: 253
  train:
    name: WavDataset # OnlineNoisyDataset
    noisy_store: noisy.flac.hdf5
    noisy_csv: train/train_28spk.csv  # "wav_id,wav_path,duration"
    clean_store: clean.flac.hdf5
    clean_csv: ${data.train.noisy_csv}
    split_wav: true
  valid:
    name: ${data.name}
    noisy_store: ${data.train.noisy_store}
    noisy_csv: valid/valid_28spk.csv
    clean_store: ${data.train.clean_store}
    clean_csv: ${data.valid.noisy_csv}
    split_wav: false
  test:
    name: ${data.name}
    noisy_store: ${data.train.noisy_store}
    noisy_csv: test/test.csv
    clean_store: ${data.train.clean_store}
    clean_csv: ${data.test.noisy_csv}
    split_wav: false
  noise_store: noise/noise.wav.hdf5
  noise_csv: noise/noise.csv # "wav_id,wav_path,duration"
  rir_store: rir/rir.wav.hdf5 
  rir_csv: rir/rir.csv # "wav_id,wav_path,duration"
  add_rir: -1
  mix_param:
    sr: ${data.sample_rate}
    snr_lower: -10
    snr_upper: 10
    randomize_snr: true
    target_level_lower: -35
    target_level_upper: -15
    fs: ${data.sample_rate}
    audio_length: 30
    silence_length: 0.2
    clean_activity_threshold: 0.6
    noise_activity_threshold: 0.0
    is_test_set: false
    lower_t60: 0.3
    upper_t60: 1.3
  dataloader:
    batch_size: 250
    shuffle: true
    num_workers: 8
    pin_memory: false
    prefetch_factor: 4
  data_augment: null
    # remix: false
    # bandmask:
    #   maxwidth: 0.2
    # shift: false
    # revecho: false

loss:
  name: SI_SNRLoss

# pytorch-lightning trainer
trainer:
  max_epochs: 5000
  gradient_clip_val: 5.0
  log_every_n_steps: 100
  check_val_every_n_epoch: 30
  strategy: ddp # ddp or ddp_find_unused_parameters_true

trainer_callbacks:
  model_checkpoint:
    monitor: valid_loss
    mode: min
    save_top_k: 3
    save_last: true
  early_stop: null
    # monitor: ${trainer_callbacks.model_checkpoint.monitor}
    # mode: ${trainer_callbacks.model_checkpoint.mode}
    # patience: 15
    # verbose: true

optimizer:
  name: Adam
  lr: 1e-4
  frequency: ${trainer.check_val_every_n_epoch}
  lr_scheduler: null
    # name: ReduceLROnPlateau
    # factor: 0.5
    # patience: 7

stft:
  name: torch # torch or filterbank
  n_fft: 510
  win_length: 510
  hop_length: 128

# ===== others =====
pool:
  name: ThreadPoolExecutor
  max_workers: null
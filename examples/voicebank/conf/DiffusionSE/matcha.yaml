# based on Matcha-TTS decoder
name: voicebank
version: -3a

system:
  name: MatchaSE
  exp_name: ${system.name}
  debug: false
  seed: 0
  log_dir: exp/logs
  train_and_test: true

model:
  name: MatchaCFM
  n_freqs: 256
  cfm_params: 
    name: CFM
    solver: euler
    sigma_min: 1e-4
  decoder_params:
    channels: [256, 256]
    dropout: 0.05
    attention_head_dim: 64
    n_blocks: 1
    num_mid_blocks: 2
    num_heads: 2
    act_fn: snakebeta
  forward_params:
    n_timesteps: 10
    temperature: 0.667
  mask: false
  pad_value: noisy # 0, 1, noisy
  debug: ${system.debug}

data:
  name: WavDataset # default dataset class
  pairs: noisy2clean # [noisy2clean, noisy2noisy, noisier2noisy]
  data_dir: data
  sample_rate: 16000
  chunk_size: 374 # frames feed to network, 124: 2s, 374: 6s
  train:
    name: WavDataset # OnlineNoisyDataset
    noisy_store: noisy.flac.hdf5
    noisy_csv: train/train_28spk.csv  # "wav_id,wav_path,duration"
    clean_store: clean.flac.hdf5
    clean_csv: ${data.train.noisy_csv}
    split_wav: true
  valid:
    name: ${data.name}
    noisy_store: ${data.train.noisy_store}
    noisy_csv: valid/valid_28spk.csv
    clean_store: ${data.train.clean_store}
    clean_csv: ${data.valid.noisy_csv}
    split_wav: false
  test:
    name: ${data.name}
    noisy_store: ${data.train.noisy_store}
    noisy_csv: test/test.csv
    clean_store: ${data.train.clean_store}
    clean_csv: ${data.test.noisy_csv}
    split_wav: false
  noise_store: noise/noise.wav.hdf5
  noise_csv: noise/noise.csv # "wav_id,wav_path,duration"
  rir_store: rir/rir.wav.hdf5 
  rir_csv: rir/rir.csv # "wav_id,wav_path,duration"
  add_rir: -1
  mix_param:
    sr: ${data.sample_rate}
    snr_lower: -10
    snr_upper: 10
    randomize_snr: true
    target_level_lower: -35
    target_level_upper: -15
    fs: ${data.sample_rate}
    audio_length: 30
    silence_length: 0.2
    clean_activity_threshold: 0.6
    noise_activity_threshold: 0.0
    is_test_set: false
    lower_t60: 0.3
    upper_t60: 1.3
  dataloader:
    batch_size: 330
    shuffle: true
    num_workers: 8
    pin_memory: false
    prefetch_factor: 4
  data_augment: # null
    remix: false
    bandmask:
      maxwidth: 0.2
    shift: false
    revecho: false

loss:
  name: FusionLoss

# pytorch-lightning trainer
trainer:
  max_epochs: 10000
  gradient_clip_val: 5.0
  log_every_n_steps: 100
  check_val_every_n_epoch: 50
  strategy: ddp # ddp or ddp_find_unused_parameters_true

trainer_callbacks:
  model_checkpoint:
    monitor: valid_loss
    mode: min
    save_top_k: 3
    save_last: true
  early_stop:
    monitor: ${trainer_callbacks.model_checkpoint.monitor}
    mode: ${trainer_callbacks.model_checkpoint.mode}
    patience: 70
    verbose: true

optimizer:
  name: Adam
  lr: 3e-4
  frequency: ${trainer.check_val_every_n_epoch}
  lr_scheduler:
    name: ReduceLROnPlateau
    factor: 0.5
    patience: 50

stft:
  name: torch # torch or filterbank
  n_fft: 512
  win_length: 512
  hop_length: 256

# ===== others =====
pool:
  name: ThreadPoolExecutor
  max_workers: null
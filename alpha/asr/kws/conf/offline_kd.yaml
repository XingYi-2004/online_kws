# 离线训练配置：中文车载 29 类 —— v2 稳定化实验
# ⚠️ 以下四项为候选设置（AdamW / 梯度裁剪 / branch_balance / 小遮罩），未证实为
#    原版 98.04% 的配方；实验目的：消除 warmup 后震荡，冲击 ≥98%。
# ✓ learnable_alpha=true + label_smoothing=0.1：按实验者回忆，KD-MT-08 基于
#   KD-MT-07 配方（其记录含这两项）修改，故本配置对齐补上（README KD 实验表 KD-MT-07）。
# 用法：cd AlphaSNN && conda run -n snn python alpha/asr/kws/offline/train_multitau.py --conf alpha/asr/kws/conf/offline_kd.yaml

system:
  cuda_visible_devices: "5"   # 训练使用的 GPU 编号，可自行修改（如 "0"、""4""；多个卡 "0,1" 只会用第一张）

exp_dir: alphasnn_29class_kd_rebuild_v2/experiment5     # v2 输出目录（保留 v1 的 94.40% 结果）
seed: 312

# ---- 数据（lhotse 预计算特征）----
train_manifest: data/fbank/command_cuts_train_29.jsonl
test_manifest: data/fbank/command_cuts_test_29.jsonl   # 干净测试集 357 条
max_duration: 1500.0
num_workers: 8

# ---- 模型（MultiTauLIFCommander，与在线管线/历史 checkpoint 同构）----
model:
  n_inputs: 80
  n_hidden_neurons: 384
  n_outputs: 29
  depths: 5
  taus: [2.0, 4.0, 8.0]
  learnable_alpha: true
  memory_mode: soft
  branch_fusion_mode: channel_adaptive
  frontend_type: see_lite
  frontend_kernel_size: 7
  frontend_dilation: 1
  frontend_pw_bias: true
  frontend_dw_bias: false
  channel_mixer_type: conv
  channel_mixer_bottleneck_ratio: 4
  channel_mixer_kernel_size: 5
  channel_mixer_dilation: 1
  channel_mixer_norm_groups: 8
  return_sequence_logits: false
  head_bias: false
  norm_type: bn
  use_dp: true
  dropout_l: 0.3
  subsampling_factor: 2
  backend: cupy
  spike_mode: lif
  init_tau: 2.0
  v_threshold: 1.0
  surrogate: atan
  surrogate_alpha: 2.0
  detach_reset: true
  decay_input: true

# ---- 优化（日志还原：lr=2e-3, wd=5e-3, warmup 30 + cosine T_max=270, 300 epoch）----
optimizer_type: adamw        # v2 候选设置：AdamW（原版类型未知，参考 MultiTau 官方配置）
lr: 0.002
weight_decay: 0.005
num_epochs: 300
warmup_epochs: 30
cosine_t_max: 270
label_smoothing: 0.1
gradient_clip: 5.0           # v2 候选设置：梯度裁剪（针对 warmup 后震荡）
branch_balance_weight: 0.01  # v2 候选设置：tau 分支均衡损失（防分支坍缩，MultiTau 官方权重）

# ---- EMA（日志：decay=0.9995）----
ema_decay: 0.9995

# ---- SpecAugment（训练时时频遮罩，评测不增强）----
spec_augment: true
spec_time_mask: 15
spec_freq_mask: 5
spec_num_time_masks: 1
spec_num_freq_masks: 1

# ---- KD（可选，kd 版配置启用；教师为先前训练的 checkpoint）----
kd_teacher: "kd_teacher/tdnn_ann_29class.pt"
kd_alpha: 0.7
kd_temperature: 10.0
